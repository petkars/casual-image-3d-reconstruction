[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "casual-image-3d-reconstruction"
dynamic = ["version"]
description = "Reproducible experiments for 3D object reconstruction from casual images"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
recon = [
    "numpy>=1.24",
    "pycolmap>=4.2,<5",
]

[project.scripts]
casual3d-manifest = "casual3d.cli:main"
casual3d-reconstruct = "casual3d.cli:reconstruct_main"
casual3d-evaluate-poses = "casual3d.cli:evaluate_poses_main"

[tool.setuptools.dynamic]
version = {attr = "casual3d.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
